name: ÖSYM takvim takibi

on:
  schedule:
    - cron: "0 6 * * *" # her gün 09:00 (Türkiye)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osym-takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pywebpush

      - name: Takvimi oku, hatırlatma günündeyse bildirim gönder
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python osym/takip.py

      - name: data/osym.json değiştiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osym.json
          git diff --cached --quiet || git commit -m "ÖSYM takvimi güncellendi"
          git push
