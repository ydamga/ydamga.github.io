<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÖDHM araçları</title>
  <meta name="description" content="ÖDHM ders programı hazırlayıcısı ve öğrenci ziyaret kaydı.">
  <script src="ayarlar.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ortak.css">
  <style>

    /* Üst satır: solda üniversite sistemleri, sağda ayarlar */
    .ust-satir { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    /* Üniversite sistemlerine hızlı geçiş */
    .kisayollar {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(4, auto);
      justify-content: start;
      gap: 8px;
    }
    .kisayollar a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid var(--accent-ink);
      color: var(--accent-ink);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out);
    }
    .kisayollar svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .kisayollar a:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 3px; }
    .kisayollar a:active { transform: scale(0.97); }
    @media (hover: hover) and (pointer: fine) {
      .kisayollar a:hover { background: var(--accent); color: var(--on-accent); }
    }

    /* Üç sütun: solda yemek, ortada araçlar, sağda sınav takvimi */
    .govde {
      margin-top: clamp(16px, 3vh, 36px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr);
      grid-template-areas: "yemek araclar osym";
      align-items: start;
      gap: 40px clamp(20px, 2.4vw, 40px);
    }
    .govde .osym { grid-area: osym; }
    .araclar { grid-area: araclar; }
    .yemek { grid-area: yemek; }
    .araclar > h2, .yemek-head h2 {
      display: flex;
      align-items: center;
      min-height: 36px;
      margin-bottom: 10px;
      font-size: clamp(1.1rem, 1.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .tools {
      list-style: none;
      display: grid;
      gap: 8px;
    }
    .tool {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      min-height: clamp(64px, 9vh, 104px);
      padding: clamp(14px, 2vh, 24px) clamp(18px, 2vw, 28px);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: background-color 150ms ease, transform 160ms var(--ease-out);
    }
    .tool h2 {
      font-size: clamp(1.35rem, 1.8vw, 1.75rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.025em;
    }
    .arrow {
      width: clamp(44px, 4vw, 56px);
      height: clamp(44px, 4vw, 56px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      transition: transform 200ms var(--ease-out);
    }
    .arrow svg { width: 45%; height: 45%; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .tool:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 4px; }
    .tool:active { transform: scale(0.99); }
    @media (hover: hover) and (pointer: fine) {
      .tool:hover { background: var(--surface-2); }
      .tool:hover .arrow { transform: translateX(6px); }
    }

    /* Günün yemeği: data/yemek.json'dan, ay başında Arelim'den aktarılır */
    .yemek[hidden] { display: none; }
    .yemek-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-bottom: 10px;
    }
    .yemek-head h2 { margin-bottom: 0; white-space: nowrap; }
    .yemek-kart { padding: 4px clamp(16px, 2vw, 24px); background: var(--surface); }
    .yemek-kart ul { list-style: none; }
    .yemek-kart li {
      padding: clamp(5px, 0.8vh, 9px) 0;
      border-bottom: 1px solid var(--surface-2);
      line-height: 1.35;
    }
    .yemek-kart li:last-child { border-bottom: 0; }
    .yemek-kart li a {
      color: inherit;
      text-decoration: none;
      text-underline-offset: 3px;
      transition: color 150ms ease;
    }
    .yemek-kart li a:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 3px; }
    @media (hover: hover) and (pointer: fine) {
      .yemek-kart li a:hover { color: var(--accent-ink); text-decoration: underline; }
    }
    .yemek-kart .bos { padding: 10px 0; color: var(--text-2); line-height: 1.5; }
    /* Bölüm altı: tarih ve aylık sayfa bağlantısı */
    .alt-satir {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .alt-satir a { color: var(--accent-ink); font-weight: 700; text-underline-offset: 3px; }
    .alt-satir a::after { content: " →"; }
    .alt-satir a:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }

    /* ÖSYM başvuruları: data/osym.json'dan, GitHub Actions her sabah günceller */
    .osym[hidden], .osym ul[hidden], .osym .siradaki[hidden] { display: none; }
    /* İlk açılışta göze çarpan: en yakın sınav */
    .siradaki {
      display: grid;
      gap: 10px;
      margin-bottom: 8px;
      padding: clamp(14px, 2vh, 24px) clamp(16px, 2vw, 24px);
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      transition: background-color 150ms ease, transform 160ms var(--ease-out);
      animation: rise 600ms var(--ease-out) both;
    }
    .siradaki:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
    .siradaki:active { transform: scale(0.99); }
    @media (hover: hover) and (pointer: fine) {
      .siradaki:hover { background: var(--accent-hover); }
    }
    .siradaki .etiket {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .osym .siradaki .ad {
      display: block;
      font-size: clamp(1.15rem, 1.7vw, 1.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.025em;
    }
    .siradaki .basvuru { display: block; margin-top: 8px; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
    .siradaki .zaman {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 14px;
      padding-top: 10px;
      border-top: 1px solid color-mix(in srgb, var(--on-accent) 20%, transparent);
      font-variant-numeric: tabular-nums;
    }
    .siradaki .zaman b {
      font-size: clamp(1.3rem, 1.9vw, 1.7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .siradaki .zaman span { font-size: 1rem; font-weight: 700; }
    .osym-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 24px;
      margin-bottom: 10px;
    }
    .osym-head h2 {
      font-size: clamp(1.1rem, 1.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .osym-head span { font-size: 0.82rem; color: var(--muted); }
    .osym ul { list-style: none; display: grid; gap: 6px; }
    .osym li a {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 16px;
      align-items: center;
      padding: clamp(7px, 1vh, 12px) clamp(14px, 1.6vw, 20px);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: background-color 150ms ease;
    }
    .osym li a:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 4px; }
    @media (hover: hover) and (pointer: fine) {
      .osym li a:hover { background: var(--surface-2); }
    }
    .osym .ad { font-weight: 700; font-size: 0.94rem; line-height: 1.25; }
    .osym .tarih { grid-column: 1 / -1; grid-row: 2; color: var(--text-2); font-size: 0.84rem; font-variant-numeric: tabular-nums; }
    .osym .gun {
      justify-self: end;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--surface-2);
      color: var(--text-2);
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    /* Uyarılar yalnızca hatırlatma günlerinde görünür */
    .osym .uyarilar { margin-bottom: 10px; }
    /* Kısa ekranlarda ve telefonda liste 3 sınavla sınırlı, sayfa kaydırmadan sığsın */
    @media (max-width: 760px), (max-height: 820px) {
      #osym-liste li:nth-child(n+4) { display: none; }
    }
    .osym .uyarilar li a { background: var(--accent); color: var(--on-accent); }
    .osym .uyarilar .tarih { color: var(--on-accent); }
    .osym .uyarilar .gun { border-color: var(--on-accent); color: var(--on-accent); }
    @media (hover: hover) and (pointer: fine) {
      .osym .uyarilar li a:hover { background: var(--accent-hover); }
    }
    .osym .bos { padding: 18px clamp(20px, 3vw, 40px); background: var(--surface); color: var(--text-2); }

    /* Giriş: kısayollar, sonra araçlar; 60 ms arayla */
    .kisayollar, .tool { animation: rise 600ms var(--ease-out) both; }
    .tools li:nth-child(1) .tool { animation-delay: 140ms; }
    .tools li:nth-child(2) .tool { animation-delay: 200ms; }

    @media (max-width: 899px) {
      .govde { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "osym osym" "yemek araclar"; }
    }
    @media (max-width: 760px) {
      /* Telefonda kısayollar tek satır, araçlar yan yana */
      .ust-satir nav { flex: 1; min-width: 0; }
      .kisayollar { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
      .kisayollar a { min-height: 40px; padding: 0 2px; font-size: 0.74rem; }
      .kisayollar svg { display: none; }
      .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tool { min-height: 64px; padding: 12px 14px; gap: 8px; }
      .tool h2 { font-size: 1.05rem; }
      .arrow { width: 32px; height: 32px; }
      .govde { grid-template-columns: 1fr; grid-template-areas: "osym" "araclar" "yemek"; row-gap: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .kisayollar, .tool, .siradaki { animation-name: fade; }
      .tool:active, .tool:hover .arrow, .siradaki:active, .kisayollar a:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="gizli">ÖDHM araçları</h1>
    <div class="ust-satir">
    <nav aria-label="Üniversite sistemleri">
      <ul class="kisayollar">
        <li><a href="https://arelim.arel.edu.tr/login/sign-in" target="_blank" rel="noopener">Arelim <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></li>
        <li><a href="https://obs.arel.edu.tr/" target="_blank" rel="noopener">OBS <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></li>
        <li><a href="https://m365.cloud.microsoft/apps/?auth=2" target="_blank" rel="noopener">Office 365 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></li>
        <li><a href="https://arelebys.arel.edu.tr/enVision/Login.aspx" target="_blank" rel="noopener">EBYS <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></li>
      </ul>
    </nav>
    <button type="button" class="ayarlar-btn" aria-haspopup="dialog" aria-label="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Ayarlar</span></button>
    </div>

    <div class="govde">
    <section class="osym" id="osym" hidden aria-labelledby="osym-baslik">
      <div class="osym-head">
        <h2 id="osym-baslik">ÖSYM sınavları</h2>
        <span id="osym-not"></span>
      </div>
      <ul class="uyarilar" id="osym-uyarilar" aria-label="Bugünün başvuru uyarıları" hidden></ul>
      <a class="siradaki" id="osym-siradaki" target="_blank" rel="noopener" hidden>
        <span>
          <span class="etiket">En yakın sınav</span>
          <span class="ad"></span>
          <span class="basvuru"></span>
        </span>
        <span class="zaman"><b></b><span></span></span>
      </a>
      <ul id="osym-liste"></ul>
      <p class="alt-satir"><span></span><a href="sinavlar.html">Aylık sınav takvimi</a></p>
    </section>

    <section class="araclar" aria-labelledby="araclar-baslik">
      <h2 id="araclar-baslik">Araçlar</h2>
      <ul class="tools">
        <li>
          <a class="tool" href="ders-programi.html">
            <h2>Ders programı</h2>
            <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </a>
        </li>
        <li>
          <a class="tool" href="ziyaret.html">
            <h2>Öğrenci ziyareti</h2>
            <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </a>
        </li>
      </ul>
    </section>

    <section class="yemek" id="yemek" hidden aria-labelledby="yemek-baslik">
      <div class="yemek-head">
        <h2 id="yemek-baslik">Günün menüsü</h2>
        <div class="secici yerleske-sec" role="group" aria-label="Yerleşke">
          <button type="button" data-yerleske="tepekent" aria-pressed="true">Tepekent</button>
          <button type="button" data-yerleske="cevizlibag" aria-pressed="false">Cevizlibağ</button>
        </div>
      </div>
      <div class="yemek-kart" aria-live="polite">
        <ul id="yemek-liste"></ul>
      </div>
      <p class="alt-satir"><span id="yemek-tarih"></span><a href="yemek.html">Aylık liste</a></p>
    </section>
    </div>
  </main>

  <footer>
    <span>ÖDHM · <span id="yil"></span></span>
  </footer>

  <script>
    (function () {
      // Hatırlatma günleri: başvurudan 7 gün önce, başvuru günü, bitişten 3 gün önce
      var ONCE = 7, BITIS = 3;
      // Tarihler Türkiye saatine göre takvim günü olarak karşılaştırılır; ?bugun=2026-11-25 ile denenebilir
      function gun(t) { return new Date(t).toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' }); }
      function kaydir(g, n) {
        var d = new Date(g + 'T12:00:00Z');
        d.setUTCDate(d.getUTCDate() + n);
        return d.toISOString().slice(0, 10);
      }
      function kisa(g) { return g.split('-').reverse().join('.'); }
      var bugun = (location.search.match(/[?&]bugun=(\d{4}-\d{2}-\d{2})/) || [])[1] || gun(Date.now());

      function satir(s, ust, alt, etiket) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = s.link;
        a.target = '_blank';
        a.rel = 'noopener';
        var ad = document.createElement('span');
        ad.className = 'ad';
        ad.textContent = ust;
        var tarih = document.createElement('span');
        tarih.className = 'tarih';
        tarih.textContent = alt;
        var g = document.createElement('span');
        g.className = 'gun';
        g.textContent = etiket;
        a.append(ad, tarih, g);
        li.appendChild(a);
        return li;
      }
      function basvuruMetni(s) {
        return s.basvuru_baslangic ? 'Başvuru ' + kisa(gun(s.basvuru_baslangic)) + ' – ' + kisa(gun(s.basvuru_bitis)) : 'Başvuru tarihi yok';
      }

      fetch('data/osym.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (veri) {
          var uyarilar = document.getElementById('osym-uyarilar');
          veri.sinavlar.forEach(function (s) {
            if (!s.basvuru_baslangic) return;
            var bas = gun(s.basvuru_baslangic), bit = gun(s.basvuru_bitis), etiket = null;
            if (kaydir(bas, -ONCE) === bugun) etiket = 'Başvuru 1 hafta sonra';
            else if (bas === bugun) etiket = 'Başvuru bugün başladı';
            else if (kaydir(bit, -BITIS) === bugun) etiket = 'Bitişe ' + BITIS + ' gün kaldı';
            if (etiket) uyarilar.appendChild(satir(s, s.ad, basvuruMetni(s), etiket));
          });
          uyarilar.hidden = !uyarilar.children.length;

          var liste = document.getElementById('osym-liste');
          var yaklasan = veri.sinavlar
            .filter(function (s) { return s.sinav_tarihi && s.sinav_tarihi >= bugun; })
            .slice(0, 6);

          // En yakın sınav büyük kartta, kalan gün sayısıyla
          var ilk = yaklasan.shift();
          if (ilk) {
            var kart = document.getElementById('osym-siradaki');
            var kalan = Math.round((new Date(ilk.sinav_tarihi + 'T12:00:00Z') - new Date(bugun + 'T12:00:00Z')) / 864e5);
            kart.href = ilk.link;
            kart.querySelector('.ad').textContent = ilk.ad;
            kart.querySelector('.basvuru').textContent = basvuruMetni(ilk);
            kart.querySelector('.zaman b').textContent = kisa(ilk.sinav_tarihi);
            kart.querySelector('.zaman span').textContent = kalan === 0 ? 'Bugün' : kalan === 1 ? 'Yarın' : kalan + ' gün kaldı';
            kart.hidden = false;
          }
          yaklasan.forEach(function (s) { liste.appendChild(satir(s, s.ad, basvuruMetni(s), 'Sınav ' + kisa(s.sinav_tarihi))); });
          if (!ilk) {
            var bos = document.createElement('li');
            bos.className = 'bos';
            bos.textContent = 'Takvimde yaklaşan sınav yok. Yeni takvim yayımlanınca burada görünür.';
            liste.appendChild(bos);
          }
          document.getElementById('osym-not').textContent =
            'Güncellendi: ' + new Date(veri.guncellendi).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          document.getElementById('osym').hidden = false;
        })
        .catch(function () { /* veri yoksa bölüm gizli kalır */ });
    })();

    // Günün yemeği. Seçilen yerleşke tarayıcıda hatırlanır; varsayılan Tepekent.
    (function () {
      var bugun = (location.search.match(/[?&]bugun=(\d{4}-\d{2}-\d{2})/) || [])[1] ||
        new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' });
      var butonlar = document.querySelectorAll('.yerleske-sec button');
      var liste = document.getElementById('yemek-liste');
      var secili = 'tepekent';
      try { secili = localStorage.getItem('yerleske') || secili; } catch (e) {}

      // Arelim listesi büyük harfle geliyor: "PİLİÇ ROTİ" → "Piliç Roti"
      function duzelt(s) {
        return s.toLocaleLowerCase('tr').replace(/(^|[\s.\/-])(\S)/g, function (m, a, b) { return a + b.toLocaleUpperCase('tr'); });
      }

      fetch('data/yemek.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (veri) {
          if (!veri.yerleskeler[secili]) secili = 'tepekent';
          function goster() {
            butonlar.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.yerleske === secili); });
            liste.textContent = '';
            var gunler = veri.yerleskeler[secili].gunler;
            var menu = gunler[bugun];
            if (menu) {
              menu.forEach(function (y) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.textContent = duzelt(y);
                a.href = 'https://www.google.com/search?q=' + encodeURIComponent(a.textContent + ' yemek');
                a.target = '_blank';
                a.rel = 'noopener';
                li.appendChild(a);
                liste.appendChild(li);
              });
            } else {
              var bos = document.createElement('li');
              bos.className = 'bos';
              // Listede bugünden sonra gün yoksa ayın listesi henüz eklenmemiştir
              var ileri = Object.keys(gunler).some(function (g) { return g > bugun; });
              bos.textContent = ileri ? 'Bugün yemekhane menüsü yok.' : 'Bu dönemin yemek listesi henüz eklenmedi.';
              liste.appendChild(bos);
            }
          }
          butonlar.forEach(function (b) {
            b.addEventListener('click', function () {
              secili = b.dataset.yerleske;
              try { localStorage.setItem('yerleske', secili); } catch (e) {}
              goster();
            });
          });
          document.getElementById('yemek-tarih').textContent =
            new Date(bugun + 'T12:00:00Z').toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long', timeZone: 'UTC' });
          goster();
          document.getElementById('yemek').hidden = false;
        })
        .catch(function () { /* veri yoksa bölüm gizli kalır */ });
    })();

  </script>
</body>
</html>
